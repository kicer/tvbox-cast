plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kicer.tvboxcast'
    compileSdk 34

    // evgrab.c 需要 NDK；AGP 8.1 的默认 NDK 版本
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.kicer.tvboxcast"
        // 机顶盒：Hi3798MV310 / Android 4.4.2 (KOT49H) / SDK 19 / armeabi-v7a
        minSdk 19
        targetSdk 19
        versionCode 2
        versionName "0.2.0"

        ndk {
            // 盒子只有 32 位 ARM
            abiFilters 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 无第三方 Java 依赖：离线可用、CI 快
dependencies {
}
